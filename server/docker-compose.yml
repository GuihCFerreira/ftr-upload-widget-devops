name: widget-server-devops-pipeline
services:
  
  db:
    image: postgres:latest
    container_name: widget-server-db-devops
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - POSTGRES_DB=$POSTGRES_DB
    volumes:
      - db-data:/var/lib/postgresql # Postgres 18+ stores data in a version-specific subdirectory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - widget

  app:
    build: .
    container_name: widget-server-app-devops
    ports:
      - 3000:3333 # Expose port 3333 from the container to port 3000 on the host
    environment:
      - CLOUDFLARE_ACCESS_KEY_ID=$CLOUDFLARE_ACCESS_KEY_ID
      - CLOUDFLARE_SECRET_ACCESS_KEY=$CLOUDFLARE_SECRET_ACCESS_KEY
      - CLOUDFLARE_BUCKET=$CLOUDFLARE_BUCKET
      - CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
      - CLOUDFLARE_PUBLIC_URL=$CLOUDFLARE_PUBLIC_URL
    depends_on:
      db:
        condition: service_healthy
    
    networks:
      - widget

volumes:
  db-data:

networks:
  widget:
    driver: bridge